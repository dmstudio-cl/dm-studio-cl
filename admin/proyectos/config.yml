# Decap CMS · proyectos privados de clientes (repo PRIVADO).
# Este archivo es público pero no contiene secretos: solo describe el formulario.
backend:
  name: github
  repo: dmstudio-cl/proyectos-clientes          # [PENDIENTE] crear repo privado
  branch: main
  base_url: https://dmstudio-cms-auth.moralesdiego905.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: "Proyecto: crear «{{path}}»"
    update: "Proyecto: actualizar «{{path}}»"
    delete: "Proyecto: eliminar «{{path}}»"
    uploadMedia: "Proyecto: subir archivo «{{path}}»"
    deleteMedia: "Proyecto: eliminar archivo «{{path}}»"

locale: es
media_folder: media
public_folder: media

collections:
  - name: proyectos
    label: Proyectos de clientes
    label_singular: Proyecto
    folder: proyectos
    extension: json
    format: json
    create: true
    identifier_field: titulo   # el nombre del archivo sale del título (sin esto Decap usaba todo el contenido, incluida la clave)
    slug: "{{year}}-{{fields.titulo}}"   # explícito: con {{slug}} Decap usó todo el contenido como nombre
    summary: "{{cliente.nombre}} · {{titulo}} · {{estado}}"
    sortable_fields: [titulo, estado]
    fields:
      - { label: Título del proyecto, name: titulo, widget: string, hint: "Ej: Cocina departamento Ñuñoa. Después de guardar, ábrelo en el Editor de modelos (/admin/editor/) para dibujar el mueble." }
      - label: Clave de acceso
        name: access_key
        widget: clave
        pattern: ['^DM-[A-Z0-9]{4}-[A-Z0-9]{4}$', "Formato DM-XXXX-XXXX (mayúsculas y números)"]
        hint: "Se genera sola al crear el proyecto (botón Generar para otra). Para revocar el acceso, genera una nueva o marca el proyecto como Archivado."
      - label: Estado
        name: estado
        widget: select
        default: borrador
        options:
          - { label: "Borrador (cliente no puede entrar)", value: borrador }
          - { label: "Propuesta enviada", value: propuesta }
          - { label: "Cambios solicitados", value: cambios }
          - { label: "Aprobado", value: aprobado }
          - { label: "En fabricación", value: fabricacion }
          - { label: "Entregado", value: entregado }
          - { label: "Archivado (acceso revocado)", value: archivado }
      - { label: Versión de la propuesta, name: version, widget: number, value_type: int, default: 1 }
      - { label: Precio válido hasta, name: vigencia, widget: datetime, date_format: "DD-MM-YYYY", time_format: false, format: "YYYY-MM-DD", required: false }
      - label: Cliente
        name: cliente
        widget: object
        fields:
          - { label: Nombre, name: nombre, widget: string }
          - { label: Email, name: email, widget: string, required: false, hint: "Recibe automáticamente un correo cuando publicas una versión o le respondes." }
          - { label: "WhatsApp (ej. 56912345678)", name: telefono, widget: string, required: false, hint: "Con número, el editor te abre WhatsApp con el aviso ya escrito para enviarlo con un toque." }
          - { label: Comuna, name: comuna, widget: string, required: false }

      - label: Tipo de modelo
        name: tipo
        widget: select
        default: melamina
        options:
          - { label: "Mueble de melamina paramétrico", value: melamina }
          - { label: "Modelo 3D (.glb)", value: glb }
      - { label: Modelo 3D (.glb), name: modelo, widget: file, required: false, hint: "Solo si el tipo es 'Modelo 3D'." }

      - label: Módulos (se dibujan en el Editor de modelos)
        name: modulos
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.nombre}} · {{fields.ancho}}×{{fields.profundidad}}×{{fields.alto}} cm"
        hint: "Lo normal es dibujarlos en /admin/editor/ y publicarlos desde ahí. Aquí puedes revisarlos o corregir un número."
        fields:
          - { label: ID (lo asigna el editor), name: id, widget: string, required: false }
          - { label: Cocina de referencia (la usa el editor), name: plantilla, widget: string, required: false }
          - { label: Nombre, name: nombre, widget: string, hint: "Ej: Mueble A, Aéreo sobre encimera" }
          - { label: Tipo, name: tipo, widget: select, default: base, options: [base, aereo, torre, isla] }
          - { label: Ancho, name: ancho, widget: number, value_type: float }
          - { label: Alto, name: alto, widget: number, value_type: float }
          - { label: Profundidad, name: profundidad, widget: number, value_type: float }
          - { label: Zócalo, name: zocalo, widget: number, value_type: float, default: 10 }
          - { label: Retiro del zócalo, name: zocalo_retiro, widget: number, value_type: float, default: 5, required: false }
          - { label: Retiro del zócalo atrás, name: zocalo_atras, widget: number, value_type: float, required: false }
          - { label: Retiro del zócalo izquierdo, name: zocalo_izq, widget: number, value_type: float, required: false }
          - { label: Retiro del zócalo derecho, name: zocalo_der, widget: number, value_type: float, required: false }
          - { label: Vuelo de la cubierta al frente, name: vuelo_frente, widget: number, value_type: float, required: false }
          - { label: Costados alargados hacia atrás, name: costados_atras, widget: number, value_type: float, required: false }
          - { label: Vuelo de la cubierta atrás, name: vuelo_atras, widget: number, value_type: float, required: false }
          - { label: Vuelo de la cubierta a la izquierda, name: vuelo_izq, widget: number, value_type: float, required: false }
          - { label: Vuelo de la cubierta a la derecha, name: vuelo_der, widget: number, value_type: float, required: false }
          - label: Luces LED (las ubica el editor)
            name: luces
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.en}} · {{fields.lado}} · {{fields.tono}}"
            fields:
              - { label: ID, name: id, widget: string, required: false }
              - { label: Dónde (modulo, cubierta o f|columna|fila), name: en, widget: string }
              - { label: Espacio entre repisas (desde abajo), name: esp, widget: number, value_type: int, required: false }
              - { label: Lado, name: lado, widget: select, options: [arriba, abajo, izq, der, atras] }
              - { label: Tono, name: tono, widget: select, options: [calida, neutra, fria] }
              - { label: Intensidad (0 a 1), name: intensidad, widget: number, value_type: float, required: false }
          - { label: Altura desde el piso, name: elevacion, widget: number, value_type: float, default: 0, hint: "Para muebles aéreos" }
          - { label: "Posición X (a lo largo del muro)", name: x, widget: number, value_type: float, default: 0 }
          - { label: "Posición Z (desde el muro)", name: z, widget: number, value_type: float, default: 0 }
          - { label: Giro en planta (grados), name: rotacion, widget: number, value_type: float, default: 0, hint: "Lo ajusta el editor. 90 = el frente mira hacia +X." }
          - { label: Lleva cubierta, name: cubierta, widget: boolean, default: false }
          - { label: Zócalo de cubierta (respaldo), name: cubierta_respaldo, widget: boolean, default: false, required: false }
          - { label: Tablero (mm), name: tablero, widget: select, default: "15", options: ["15", "18"], required: false }
          - { label: Artefacto de piso (lo usa el editor), name: artefacto, widget: string, required: false }
          - { label: Costados visibles, name: costados, widget: select, options: [frente, cuerpo], required: false }
          - { label: Materiales por pieza (los asigna el editor), name: materiales, widget: string, required: false }
          - { label: Piezas quitadas del cuerpo, name: quitar, widget: select, multiple: true, options: [piso, techo, fondo, izq, der], required: false }
          - { label: Mueble agrupado (lo usa el editor), name: grupo, widget: string, required: false }
          - { label: Nombre del mueble agrupado, name: grupo_nombre, widget: string, required: false }
          - label: Encimeras y lavaplatos (los ubica el editor)
            name: artefactos
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.tipo}} {{fields.ancho}}×{{fields.fondo}}"
            fields:
              - { label: ID, name: id, widget: string, required: false }
              - { label: Modelo, name: tipo, widget: select, options: [encimera_gas, encimera_electrica, encimera_2, lavaplatos_1, lavaplatos_2] }
              - { label: Al costado izquierdo (cm), name: desde, widget: number, value_type: float }
              - { label: Al canto de la cubierta (cm), name: frente, widget: number, value_type: float }
              - { label: Ancho (cm), name: ancho, widget: number, value_type: float }
              - { label: Fondo (cm), name: fondo, widget: number, value_type: float }
              - { label: Escurridor, name: lado, widget: select, options: [derecha, izquierda], required: false }
          - label: Columnas (de izquierda a derecha)
            name: columnas
            widget: list
            summary: "{{fields.ancho}} cm · {{fields.frentes}}"
            fields:
              - { label: Ancho, name: ancho, widget: number, value_type: float }
              - label: Frentes (de arriba a abajo)
                name: frentes
                widget: list
                summary: "{{fields.tipo}} {{fields.alto}} cm"
                fields:
                  - { label: Tipo, name: tipo, widget: select, options: [puerta, puerta_doble, cajon, panel, abierto, campana] }
                  - { label: Alto, name: alto, widget: number, value_type: float }
                  - { label: Bisagra, name: bisagra, widget: select, default: izquierda, options: [izquierda, derecha, arriba, abajo], required: false }
                  - { label: Repisas, name: repisas, widget: number, value_type: int, required: false }
                  - { label: Hojas (puertas de la sección), name: hojas, widget: number, value_type: int, required: false }
          - label: Tiradores (ubicados en el editor)
            name: tiradores
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.modelo}} · columna {{fields.col}} fila {{fields.fila}}"
            fields:
              - { label: ID, name: id, widget: string, required: false }
              - { label: Modelo, name: modelo, widget: select, options: [barra-96, barra-128, barra-192, barra-320, boton, canto, perfil, concha] }
              - { label: Color, name: color, widget: select, default: negro, options: [negro, acero, dorado, blanco] }
              - { label: Columna (desde 0), name: col, widget: number, value_type: int }
              - { label: Fila (desde 0), name: fila, widget: number, value_type: int }
              - { label: Desde el centro → (cm), name: dx, widget: number, value_type: float, default: 0 }
              - { label: Desde el centro ↑ (cm), name: dy, widget: number, value_type: float, default: 0 }
              - { label: Giro (°), name: rot, widget: number, value_type: float, default: 0 }

      - label: Opciones visibles para el cliente
        name: opciones
        widget: object
        fields:
          - { label: Melaminas habilitadas, name: melaminas, widget: select, multiple: true, required: false, hint: "Vacío = todo el catálogo Masisa", options: [{ label: "Boreal (Unicolor)", value: "boreal" }, { label: "Gris Ceniza (Unicolor)", value: "gris-ceniza" }, { label: "Manglar (Unicolor)", value: "manglar" }, { label: "Terracota Charyn (Unicolor)", value: "terracota-charyn" }, { label: "Uyuni (Unicolor)", value: "uyuni" }, { label: "Aluminio (Unicolor)", value: "aluminio" }, { label: "Azul Acero (Unicolor)", value: "azul-acero" }, { label: "Blanco (Unicolor)", value: "blanco-softwood" }, { label: "Gres (Unicolor)", value: "gres" }, { label: "Gris (Unicolor)", value: "gris" }, { label: "Gris Grafito (Unicolor)", value: "gris-grafito-natural-matt" }, { label: "Gris Grafito (Unicolor)", value: "gris-grafito-soft" }, { label: "Negro (Unicolor)", value: "negro-natural-matt" }, { label: "Negro (Unicolor)", value: "negro-soft" }, { label: "Pacífico (Unicolor)", value: "pacifico" }, { label: "Rojo Colonial (Unicolor)", value: "rojo-colonial" }, { label: "Verde Glaciar (Unicolor)", value: "verde-glaciar" }, { label: "Visón (Unicolor)", value: "vison-texstone" }, { label: "Visón (Unicolor)", value: "vison-basic" }, { label: "Grafito (Unicolor)", value: "grafito-ultra-mate" }, { label: "Negro (Unicolor)", value: "negro-ultra-mate" }, { label: "Visón (Unicolor)", value: "vison-ultra-mate" }, { label: "Blanco (Unicolor)", value: "blanco-alto-brillo" }, { label: "Grafito (Unicolor)", value: "grafito-alto-brillo" }, { label: "Negro (Unicolor)", value: "negro-alto-brillo" }, { label: "Ciprés Dorado (Maderas)", value: "cipres-dorado" }, { label: "Nogal Biloba (Maderas)", value: "nogal-biloba" }, { label: "Acacia Arena (Maderas)", value: "acacia-arena" }, { label: "Bosco (Maderas)", value: "bosco" }, { label: "Carvalo (Maderas)", value: "carvalo" }, { label: "Castaño Blanco (Maderas)", value: "castano-blanco" }, { label: "Cava (Maderas)", value: "cava" }, { label: "Cedro (Maderas)", value: "cedro" }, { label: "Cerezo (Maderas)", value: "cerezo" }, { label: "Coigüe (Maderas)", value: "coigue" }, { label: "Coigüe Chocolate (Maderas)", value: "coigue-chocolate" }, { label: "Colina (Maderas)", value: "colina" }, { label: "Enigma (Maderas)", value: "enigma" }, { label: "Fogón (Maderas)", value: "fogon" }, { label: "Fresno Humo (Maderas)", value: "fresno-humo" }, { label: "Laricina (Maderas)", value: "laricina" }, { label: "Nogal Africano (Maderas)", value: "nogal-africano" }, { label: "Nogal Amazónico (Maderas)", value: "nogal-amazonico" }, { label: "Nogal Ceniza (Maderas)", value: "nogal-ceniza" }, { label: "Olmo Alpino (Maderas)", value: "olmo-alpino" }, { label: "Peral (Maderas)", value: "peral" }, { label: "Roble Antracita (Maderas)", value: "roble-antracita" }, { label: "Roble Milano (Maderas)", value: "roble-milano" }, { label: "Roble Moro (Maderas)", value: "roble-moro" }, { label: "Roble Santana (Maderas)", value: "roble-santana" }, { label: "Sahara (Maderas)", value: "sahara" }, { label: "Santorini (Maderas)", value: "santorini" }, { label: "Savia (Maderas)", value: "savia" }, { label: "Teca Limo (Maderas)", value: "teca-limo" }, { label: "Valle (Maderas)", value: "valle" }, { label: "Cantera (Piedras y Textiles)", value: "cantera" }, { label: "Concreto Metropolitan (Piedras y Textiles)", value: "concreto-metropolitan" }, { label: "Cumbre (Piedras y Textiles)", value: "cumbre" }, { label: "Fibra (Piedras y Textiles)", value: "fibra" }, { label: "Lino (Piedras y Textiles)", value: "lino" }, { label: "Magma (Piedras y Textiles)", value: "magma" }, { label: "Sierra (Piedras y Textiles)", value: "sierra" }] }
          - { label: Melamina inicial, name: melamina_inicial, widget: select, required: false, options: [{ label: "Boreal (Unicolor)", value: "boreal" }, { label: "Gris Ceniza (Unicolor)", value: "gris-ceniza" }, { label: "Manglar (Unicolor)", value: "manglar" }, { label: "Terracota Charyn (Unicolor)", value: "terracota-charyn" }, { label: "Uyuni (Unicolor)", value: "uyuni" }, { label: "Aluminio (Unicolor)", value: "aluminio" }, { label: "Azul Acero (Unicolor)", value: "azul-acero" }, { label: "Blanco (Unicolor)", value: "blanco-softwood" }, { label: "Gres (Unicolor)", value: "gres" }, { label: "Gris (Unicolor)", value: "gris" }, { label: "Gris Grafito (Unicolor)", value: "gris-grafito-natural-matt" }, { label: "Gris Grafito (Unicolor)", value: "gris-grafito-soft" }, { label: "Negro (Unicolor)", value: "negro-natural-matt" }, { label: "Negro (Unicolor)", value: "negro-soft" }, { label: "Pacífico (Unicolor)", value: "pacifico" }, { label: "Rojo Colonial (Unicolor)", value: "rojo-colonial" }, { label: "Verde Glaciar (Unicolor)", value: "verde-glaciar" }, { label: "Visón (Unicolor)", value: "vison-texstone" }, { label: "Visón (Unicolor)", value: "vison-basic" }, { label: "Grafito (Unicolor)", value: "grafito-ultra-mate" }, { label: "Negro (Unicolor)", value: "negro-ultra-mate" }, { label: "Visón (Unicolor)", value: "vison-ultra-mate" }, { label: "Blanco (Unicolor)", value: "blanco-alto-brillo" }, { label: "Grafito (Unicolor)", value: "grafito-alto-brillo" }, { label: "Negro (Unicolor)", value: "negro-alto-brillo" }, { label: "Ciprés Dorado (Maderas)", value: "cipres-dorado" }, { label: "Nogal Biloba (Maderas)", value: "nogal-biloba" }, { label: "Acacia Arena (Maderas)", value: "acacia-arena" }, { label: "Bosco (Maderas)", value: "bosco" }, { label: "Carvalo (Maderas)", value: "carvalo" }, { label: "Castaño Blanco (Maderas)", value: "castano-blanco" }, { label: "Cava (Maderas)", value: "cava" }, { label: "Cedro (Maderas)", value: "cedro" }, { label: "Cerezo (Maderas)", value: "cerezo" }, { label: "Coigüe (Maderas)", value: "coigue" }, { label: "Coigüe Chocolate (Maderas)", value: "coigue-chocolate" }, { label: "Colina (Maderas)", value: "colina" }, { label: "Enigma (Maderas)", value: "enigma" }, { label: "Fogón (Maderas)", value: "fogon" }, { label: "Fresno Humo (Maderas)", value: "fresno-humo" }, { label: "Laricina (Maderas)", value: "laricina" }, { label: "Nogal Africano (Maderas)", value: "nogal-africano" }, { label: "Nogal Amazónico (Maderas)", value: "nogal-amazonico" }, { label: "Nogal Ceniza (Maderas)", value: "nogal-ceniza" }, { label: "Olmo Alpino (Maderas)", value: "olmo-alpino" }, { label: "Peral (Maderas)", value: "peral" }, { label: "Roble Antracita (Maderas)", value: "roble-antracita" }, { label: "Roble Milano (Maderas)", value: "roble-milano" }, { label: "Roble Moro (Maderas)", value: "roble-moro" }, { label: "Roble Santana (Maderas)", value: "roble-santana" }, { label: "Sahara (Maderas)", value: "sahara" }, { label: "Santorini (Maderas)", value: "santorini" }, { label: "Savia (Maderas)", value: "savia" }, { label: "Teca Limo (Maderas)", value: "teca-limo" }, { label: "Valle (Maderas)", value: "valle" }, { label: "Cantera (Piedras y Textiles)", value: "cantera" }, { label: "Concreto Metropolitan (Piedras y Textiles)", value: "concreto-metropolitan" }, { label: "Cumbre (Piedras y Textiles)", value: "cumbre" }, { label: "Fibra (Piedras y Textiles)", value: "fibra" }, { label: "Lino (Piedras y Textiles)", value: "lino" }, { label: "Magma (Piedras y Textiles)", value: "magma" }, { label: "Sierra (Piedras y Textiles)", value: "sierra" }] }
          - { label: Tiradores habilitados (nombres), name: tiradores, widget: list, required: false, hint: "Nombres tal como están en Configuración de precios. Vacío = todos." }
          - { label: Cubiertas habilitadas (nombres), name: cubiertas, widget: list, required: false, hint: "Nombres tal como están en Configuración de precios. Vacío = todas." }

      - label: Recomendaciones (encimeras, campanas…)
        name: recomendados
        widget: list
        required: false
        hint: "No se cobran: el cliente las compra directo en la tienda."
        fields:
          - { label: Tipo, name: tipo, widget: select, options: [encimera, campana, lavaplatos, griferia, otro] }
          - { label: Nombre, name: nombre, widget: string }
          - { label: Link, name: url, widget: string }
          - { label: Medida (cm), name: medida, widget: string, required: false }

      - label: Electrodomésticos (los ubica el editor; referencia sin precio)
        name: objetos
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.nombre}} {{fields.ancho}}×{{fields.alto}}"
        fields:
          - { label: ID, name: id, widget: string, required: false }
          - { label: Modelo, name: tipo, widget: select, options: [refri1, refri2, lavavajillas, horno, microondas, freidora, cafetera, hervidor, colgante] }
          - { label: Largo del cable (colgante), name: cable, widget: number, value_type: float, required: false }
          - { label: Nombre, name: nombre, widget: string }
          - { label: X (cm), name: x, widget: number, value_type: float }
          - { label: Z (cm), name: z, widget: number, value_type: float }
          - { label: Altura del piso (cm), name: elevacion, widget: number, value_type: float }
          - { label: Giro (°), name: rotacion, widget: number, value_type: float }
          - { label: Ancho (cm), name: ancho, widget: number, value_type: float }
          - { label: Alto (cm), name: alto, widget: number, value_type: float }
          - { label: Fondo (cm), name: fondo, widget: number, value_type: float }
          - { label: Color, name: color, widget: select, options: [acero, negro, blanco], required: false }

      - label: Colores y materiales (los elige el editor)
        name: colores
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Zócalo, name: zocalo, widget: select, options: [grafito, negro, aluminio, blanco, frente], required: false }
          - { label: Interior y cuerpo, name: cuerpo, widget: select, options: [blanco, gris, negro], required: false }
          - { label: Costados visibles, name: costados, widget: select, options: [frente, cuerpo], required: false }
          - { label: Marcos de ventanas, name: marco, widget: select, options: [blanco, negro, aluminio, madera, grafito, bronce, champagne], required: false }
          - { label: Puertas de muro, name: hoja, widget: select, options: [madera, roble, nogal, wengue, blanca, hueso, gris, grafito, negra, verde, azul, terracota], required: false }
          - { label: Lavaplatos, name: lavaplatos, widget: select, options: [acero, negro, blanco], required: false }
          - { label: Cocina y encimeras, name: cocina, widget: select, options: [acero, negro, blanco], required: false }

      - label: Espacio (opcional)
        name: espacio
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Largo, name: largo, widget: number, value_type: float, required: false }
          - { label: Ancho, name: ancho, widget: number, value_type: float, required: false }
          - { label: Alto, name: alto, widget: number, value_type: float, default: 240, required: false }
          - { label: Espacio cerrado (lo define el editor), name: cerrado, widget: boolean, default: false, required: false }
          - label: Planta (puntos de la cara interior de los muros; se dibujan en el editor)
            name: puntos
            widget: list
            required: false
            collapsed: true
            summary: "x {{fields.x}} · z {{fields.z}}"
            fields:
              - { label: X (cm), name: x, widget: number, value_type: float }
              - { label: Z (cm), name: z, widget: number, value_type: float }
          - label: Muros (etiqueta interna, espesor y alto; uno por tramo de la planta)
            name: muros
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.etiqueta}} · {{fields.espesor}} cm"
            fields:
              - { label: Etiqueta (no la ve el cliente), name: etiqueta, widget: string, required: false }
              - { label: Espesor (cm), name: espesor, widget: number, value_type: float, default: 15 }
              - { label: Alto (cm), name: alto, widget: number, value_type: float, required: false }
              - { label: Eliminado (no se dibuja), name: oculto, widget: boolean, default: false, required: false }
              - label: Ventanas y puertas (se dibujan en el editor)
                name: vanos
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.tipo}} {{fields.ancho}}×{{fields.alto}}"
                fields:
                  - { label: ID, name: id, widget: string, required: false }
                  - { label: Modelo, name: tipo, widget: select, options: [ventana, ventana_cocina, ventana_alta, ventanal, puerta, puerta_doble, vano] }
                  - { label: Desde el extremo izquierdo (cm), name: desde, widget: number, value_type: float }
                  - { label: Ancho (cm), name: ancho, widget: number, value_type: float }
                  - { label: Alto (cm), name: alto, widget: number, value_type: float }
                  - { label: Antepecho (cm), name: antepecho, widget: number, value_type: float, default: 0 }
                  - { label: Material propio (lo asigna el editor), name: material, widget: string, required: false }
          - { label: Fotos del cliente, name: fotos, widget: list, required: false, field: { label: Foto, name: foto, widget: image } }

      - label: Costos internos (NUNCA se muestran al cliente)
        name: costos
        widget: list
        required: false
        hint: "Si el modelo se publicó desde el Editor, melamina, cholguán, bisagras, correderas y tapacanto se calculan solos: aquí solo extras (agorex, diluyente, transporte…). Tiradores y cubierta también se suman solos. El Worker aplica luz (20%) y el factor 2.3."
        summary: "{{fields.cantidad}} × {{fields.item}}"
        fields:
          - { label: Ítem, name: item, widget: string, hint: "Ej: plancha melamina, bisagras, correderas, agorex, diluyente, transporte" }
          - { label: Cantidad, name: cantidad, widget: number, value_type: float, default: 1 }
          - { label: Precio unitario (CLP), name: unitario, widget: number, value_type: int }
          - { label: Precio según la melamina elegida, name: por_melamina, widget: boolean, default: false, required: false, hint: "Si está activo, se usa el precio de plancha de la melamina que elija el cliente (Configuración de precios)." }
      - { label: Condiciones (opcional), name: condiciones, widget: text, required: false, hint: "Si está vacío se usan las condiciones generales." }
      - { label: Notas internas, name: notas, widget: text, required: false }

  - name: configuracion
    label: Configuración de precios
    files:
      - name: constantes
        label: Constantes y costos base
        file: config/precios.json
        format: json
        fields:
          - { label: Luz (% sobre materiales), name: luz, widget: number, value_type: float, default: 0.2, hint: "0.2 = 20%" }
          - { label: Factor de precio, name: factor, widget: number, value_type: float, default: 2.3 }
          - { label: Anticipo, name: anticipo, widget: number, value_type: float, default: 0.5, hint: "0.5 = 50%" }
          - { label: Condiciones generales, name: condiciones, widget: text, required: false, default: "Precio en CLP. Anticipo del 50% para iniciar la fabricación; saldo contra entrega e instalación." }
          - label: Precio por plancha de melamina
            name: planchas
            widget: list
            required: false
            fields:
              - { label: Melamina, name: codigo, widget: select, options: [{ label: "* Todas (precio por defecto)", value: "*" }, { label: "Boreal (Unicolor)", value: "boreal" }, { label: "Gris Ceniza (Unicolor)", value: "gris-ceniza" }, { label: "Manglar (Unicolor)", value: "manglar" }, { label: "Terracota Charyn (Unicolor)", value: "terracota-charyn" }, { label: "Uyuni (Unicolor)", value: "uyuni" }, { label: "Aluminio (Unicolor)", value: "aluminio" }, { label: "Azul Acero (Unicolor)", value: "azul-acero" }, { label: "Blanco (Unicolor)", value: "blanco-softwood" }, { label: "Gres (Unicolor)", value: "gres" }, { label: "Gris (Unicolor)", value: "gris" }, { label: "Gris Grafito (Unicolor)", value: "gris-grafito-natural-matt" }, { label: "Gris Grafito (Unicolor)", value: "gris-grafito-soft" }, { label: "Negro (Unicolor)", value: "negro-natural-matt" }, { label: "Negro (Unicolor)", value: "negro-soft" }, { label: "Pacífico (Unicolor)", value: "pacifico" }, { label: "Rojo Colonial (Unicolor)", value: "rojo-colonial" }, { label: "Verde Glaciar (Unicolor)", value: "verde-glaciar" }, { label: "Visón (Unicolor)", value: "vison-texstone" }, { label: "Visón (Unicolor)", value: "vison-basic" }, { label: "Grafito (Unicolor)", value: "grafito-ultra-mate" }, { label: "Negro (Unicolor)", value: "negro-ultra-mate" }, { label: "Visón (Unicolor)", value: "vison-ultra-mate" }, { label: "Blanco (Unicolor)", value: "blanco-alto-brillo" }, { label: "Grafito (Unicolor)", value: "grafito-alto-brillo" }, { label: "Negro (Unicolor)", value: "negro-alto-brillo" }, { label: "Ciprés Dorado (Maderas)", value: "cipres-dorado" }, { label: "Nogal Biloba (Maderas)", value: "nogal-biloba" }, { label: "Acacia Arena (Maderas)", value: "acacia-arena" }, { label: "Bosco (Maderas)", value: "bosco" }, { label: "Carvalo (Maderas)", value: "carvalo" }, { label: "Castaño Blanco (Maderas)", value: "castano-blanco" }, { label: "Cava (Maderas)", value: "cava" }, { label: "Cedro (Maderas)", value: "cedro" }, { label: "Cerezo (Maderas)", value: "cerezo" }, { label: "Coigüe (Maderas)", value: "coigue" }, { label: "Coigüe Chocolate (Maderas)", value: "coigue-chocolate" }, { label: "Colina (Maderas)", value: "colina" }, { label: "Enigma (Maderas)", value: "enigma" }, { label: "Fogón (Maderas)", value: "fogon" }, { label: "Fresno Humo (Maderas)", value: "fresno-humo" }, { label: "Laricina (Maderas)", value: "laricina" }, { label: "Nogal Africano (Maderas)", value: "nogal-africano" }, { label: "Nogal Amazónico (Maderas)", value: "nogal-amazonico" }, { label: "Nogal Ceniza (Maderas)", value: "nogal-ceniza" }, { label: "Olmo Alpino (Maderas)", value: "olmo-alpino" }, { label: "Peral (Maderas)", value: "peral" }, { label: "Roble Antracita (Maderas)", value: "roble-antracita" }, { label: "Roble Milano (Maderas)", value: "roble-milano" }, { label: "Roble Moro (Maderas)", value: "roble-moro" }, { label: "Roble Santana (Maderas)", value: "roble-santana" }, { label: "Sahara (Maderas)", value: "sahara" }, { label: "Santorini (Maderas)", value: "santorini" }, { label: "Savia (Maderas)", value: "savia" }, { label: "Teca Limo (Maderas)", value: "teca-limo" }, { label: "Valle (Maderas)", value: "valle" }, { label: "Cantera (Piedras y Textiles)", value: "cantera" }, { label: "Concreto Metropolitan (Piedras y Textiles)", value: "concreto-metropolitan" }, { label: "Cumbre (Piedras y Textiles)", value: "cumbre" }, { label: "Fibra (Piedras y Textiles)", value: "fibra" }, { label: "Lino (Piedras y Textiles)", value: "lino" }, { label: "Magma (Piedras y Textiles)", value: "magma" }, { label: "Sierra (Piedras y Textiles)", value: "sierra" }] }
              - { label: Formato, name: formato, widget: select, required: false, options: ["1830x2500", "2140x2500"] }
              - { label: Espesor (mm), name: espesor, widget: select, required: false, options: ["5.5", "15", "18"] }
              - { label: Precio (CLP), name: precio, widget: number, value_type: int }
              - { label: Link Imperial (para actualizar precio y stock), name: url_imperial, widget: string, required: false }
              - { label: Link Homecenter (para actualizar precio y stock), name: url_sodimac, widget: string, required: false }
          - label: Cholguán (traseras y fondos de cajón)
            name: cholguan
            widget: list
            required: false
            hint: "Código: blanco, o el código de una melamina para cholguán de color. * = precio por defecto."
            fields:
              - { label: Código, name: codigo, widget: string, default: blanco }
              - { label: Formato, name: formato, widget: select, required: false, options: ["1520x2440", "1830x2500"] }
              - { label: Precio por plancha (CLP), name: precio, widget: number, value_type: int }
              - { label: Link Imperial, name: url_imperial, widget: string, required: false }
              - { label: Link Homecenter, name: url_sodimac, widget: string, required: false }
          - label: Herrajes y tapacanto
            name: herrajes
            widget: object
            required: false
            fields:
              - { label: Bisagra de cierre suave (CLP c/u), name: bisagra, widget: number, value_type: int, required: false }
              - { label: Tapacanto (CLP por metro), name: tapacanto_ml, widget: number, value_type: int, required: false }
              - { label: Merma de tableros (%), name: merma, widget: number, value_type: float, default: 0.1, required: false, hint: "0.1 = 10% extra por cortes" }
              - label: Productos en las tiendas (actualizan los precios de herrajes)
                name: productos
                widget: list
                required: false
                summary: "{{fields.item}} {{fields.largo}}"
                hint: "Pega el link de la ficha en Imperial y/o Homecenter. Contenido = unidades del paquete (bisagras), pares (correderas) o metros del rollo (tapacanto)."
                fields:
                  - { label: Ítem, name: item, widget: select, options: [bisagra, corredera, tapacanto] }
                  - { label: Largo (solo correderas, cm), name: largo, widget: select, required: false, options: ["25", "30", "35", "40", "45", "50", "55"] }
                  - { label: Contenido del paquete, name: contenido, widget: number, value_type: float, default: 1 }
                  - { label: Link Imperial, name: url_imperial, widget: string, required: false }
                  - { label: Link Homecenter, name: url_sodimac, widget: string, required: false }
              - label: Correderas telescópicas de cierre suave (precio por par)
                name: correderas
                widget: list
                required: false
                fields:
                  - { label: Largo (cm), name: largo, widget: select, options: ["25", "30", "35", "40", "45", "50", "55"] }
                  - { label: Precio por par (CLP), name: precio, widget: number, value_type: int }
          - label: Tiradores
            name: tiradores
            widget: list
            required: false
            fields:
              - { label: Nombre, name: nombre, widget: string }
              - { label: Forma, name: forma, widget: select, default: barra, options: [{ label: "Barra", value: barra }, { label: "Botón", value: boton }, { label: "Perfil / gola", value: perfil }, { label: "Sin tirador (push)", value: sin }] }
              - { label: Color, name: color, widget: color, default: "#161616" }
              - { label: Material (para el brillo), name: color_nombre, widget: string, required: false, hint: "Ej: acero, aluminio, latón. Si es metal se ve brillante." }
              - { label: Largo (cm), name: largo, widget: number, value_type: int, default: 16, required: false }
              - { label: Precio unitario (CLP), name: precio, widget: number, value_type: int }
          - label: Cubiertas
            name: cubiertas
            widget: list
            required: false
            fields:
              - { label: Nombre, name: nombre, widget: string }
              - { label: Color, name: color, widget: color, default: "#cfc9bc" }
              - { label: Precio por metro lineal (CLP), name: precio_ml, widget: number, value_type: int, required: false, hint: "Solo si no eliges un material: con material se calcula por m² con la tabla de abajo." }
              - { label: Material (se cotiza por m²), name: material, widget: select, required: false, options: [postformado, granito, cuarzo, marmol] }
          - label: Cubiertas · precio por m² y merma por material
            name: cubiertas_tabla
            widget: object
            required: false
            collapsed: true
            hint: "Vacío = valores por defecto (postformado 65.000 ×1,10; granito 160.000 ×1,18; cuarzo 245.000 ×1,18; mármol 400.000 ×1,20)."
            fields:
              - { label: Postformado CLP/m², name: postformado, widget: number, value_type: int, required: false }
              - { label: Granito CLP/m², name: granito, widget: number, value_type: int, required: false }
              - { label: Cuarzo CLP/m², name: cuarzo, widget: number, value_type: int, required: false }
              - { label: Mármol CLP/m², name: marmol, widget: number, value_type: int, required: false }
              - { label: Aplicar luz y factor a las cubiertas, name: con_factor, widget: boolean, default: true, required: false, hint: "Activado (normal): la cubierta lleva el ×1,2 ×2,3 como el resto. Desactivado: se suma a su valor." }
