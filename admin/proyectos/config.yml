          - { label: Tiradores habilitados (nombres), name: tiradores, widget: list, required: false, hint: "Nombres tal como están en Configuración de precios. Vacío = todos." }
          - { label: Cubiertas habilitadas (nombres), name: cubiertas, widget: list, required: false, hint: "Nombres tal como están en Configuración de precios. Vacío = todas." }

      - label: Recomendaciones (encimeras, campanas…)
        name: recomendados
        widget: list
        required: false
        hint: "No se cobran: el cliente las compra directo en la tienda."
        fields:
          - { label: Tipo, name: tipo, widget: select, options: [encimera, campana, lavaplatos, griferia, otro] }
          - { label: Nombre, name: nombre, widget: string }
          - { label: Link, name: url, widget: string }
          - { label: Medida (cm), name: medida, widget: string, required: false }

      - label: Electrodomésticos (los ubica el editor; referencia sin precio)
        name: objetos
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.nombre}} {{fields.ancho}}×{{fields.alto}}"
        fields:
          - { label: ID, name: id, widget: string, required: false }
          - { label: Modelo, name: tipo, widget: select, options: [refri1, refri2, lavavajillas, conservadora, horno, microondas, freidora, cafetera, hervidor, colgante] }
          - { label: Largo del cable (colgante), name: cable, widget: number, value_type: float, required: false }
          - { label: Nombre, name: nombre, widget: string }
          - { label: X (cm), name: x, widget: number, value_type: float }
          - { label: Z (cm), name: z, widget: number, value_type: float }
          - { label: Altura del piso (cm), name: elevacion, widget: number, value_type: float }
          - { label: Giro (°), name: rotacion, widget: number, value_type: float }
          - { label: Ancho (cm), name: ancho, widget: number, value_type: float }
          - { label: Alto (cm), name: alto, widget: number, value_type: float }
          - { label: Fondo (cm), name: fondo, widget: number, value_type: float }
          - { label: Color, name: color, widget: select, options: [acero, negro, blanco], required: false }
          - label: Productos recomendados (el cliente los ve al tocar el electrodoméstico)
            name: links
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.nombre}} · {{fields.tienda}}"
            fields:
              - { label: Nombre, name: nombre, widget: string }
              - { label: Tienda, name: tienda, widget: string, required: false }
              - { label: Precio de referencia (CLP), name: precio, widget: number, value_type: int, required: false }
              - { label: Link, name: url, widget: string }

      - label: Colores y materiales (los elige el editor)
        name: colores
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Zócalo, name: zocalo, widget: select, options: [grafito, negro, aluminio, blanco, frente], required: false }
          - { label: Interior y cuerpo, name: cuerpo, widget: select, options: [blanco, gris, negro], required: false }
          - { label: Costados visibles, name: costados, widget: select, options: [frente, cuerpo], required: false }
          - { label: Marcos de ventanas, name: marco, widget: select, options: [blanco, negro, aluminio, madera, grafito, bronce, champagne], required: false }
          - { label: Puertas de muro, name: hoja, widget: select, options: [madera, roble, nogal, wengue, blanca, hueso, gris, grafito, negra, verde, azul, terracota], required: false }
          - { label: Lavaplatos, name: lavaplatos, widget: select, options: [acero, negro, blanco], required: false }
          - { label: Cocina y encimeras, name: cocina, widget: select, options: [acero, negro, blanco], required: false }

      - label: Espacio (opcional)
        name: espacio
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Largo, name: largo, widget: number, value_type: float, required: false }
          - { label: Ancho, name: ancho, widget: number, value_type: float, required: false }
          - { label: Alto, name: alto, widget: number, value_type: float, default: 240, required: false }
          - { label: Espacio cerrado (lo define el editor), name: cerrado, widget: boolean, default: false, required: false }
          - label: Planta (puntos de la cara interior de los muros; se dibujan en el editor)
            name: puntos
            widget: list
            required: false
            collapsed: true
            summary: "x {{fields.x}} · z {{fields.z}}"
            fields:
              - { label: X (cm), name: x, widget: number, value_type: float }
              - { label: Z (cm), name: z, widget: number, value_type: float }
          - label: Muros (etiqueta interna, espesor y alto; uno por tramo de la planta)
            name: muros
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.etiqueta}} · {{fields.espesor}} cm"
            fields:
              - { label: Etiqueta (no la ve el cliente), name: etiqueta, widget: string, required: false }
              - { label: Espesor (cm), name: espesor, widget: number, value_type: float, default: 15 }
              - { label: Alto (cm), name: alto, widget: number, value_type: float, required: false }
              - { label: Eliminado (no se dibuja), name: oculto, widget: boolean, default: false, required: false }
              - label: Ventanas y puertas (se dibujan en el editor)
                name: vanos
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.tipo}} {{fields.ancho}}×{{fields.alto}}"
                fields:
                  - { label: ID, name: id, widget: string, required: false }
                  - { label: Modelo, name: tipo, widget: select, options: [ventana, ventana_cocina, ventana_alta, ventanal, puerta, puerta_doble, vano] }
                  - { label: Desde el extremo izquierdo (cm), name: desde, widget: number, value_type: float }
                  - { label: Ancho (cm), name: ancho, widget: number, value_type: float }
                  - { label: Alto (cm), name: alto, widget: number, value_type: float }
                  - { label: Antepecho (cm), name: antepecho, widget: number, value_type: float, default: 0 }
                  - { label: Material propio (lo asigna el editor), name: material, widget: string, required: false }
          - { label: Fotos del cliente, name: fotos, widget: list, required: false, field: { label: Foto, name: foto, widget: image } }

      - label: Costos internos (NUNCA se muestran al cliente)
        name: costos
        widget: list
        required: false
        hint: "Si el modelo se publicó desde el Editor, melamina, cholguán, bisagras, correderas y tapacanto se calculan solos: aquí solo extras (agorex, diluyente, transporte…). Tiradores y cubierta también se suman solos. El Worker aplica luz (20%) y el factor 2.3."
        summary: "{{fields.cantidad}} × {{fields.item}}"
        fields:
          - { label: Ítem, name: item, widget: string, hint: "Ej: plancha melamina, bisagras, correderas, agorex, diluyente, transporte" }
          - { label: Cantidad, name: cantidad, widget: number, value_type: float, default: 1 }
          - { label: Precio unitario (CLP), name: unitario, widget: number, value_type: int }
          - { label: Precio según la melamina elegida, name: por_melamina, widget: boolean, default: false, required: false, hint: "Si está activo, se usa el precio de plancha de la melamina que elija el cliente (Configuración de precios)." }
      - { label: Terceros de cubierta de este proyecto (opcional), name: terceros_cubierta, widget: number, value_type: float, required: false, hint: "0.1 = 10 % sobre el costo de la cubierta que instala un tercero. Vacío = el general de Precios." }
      - { label: Condiciones (opcional), name: condiciones, widget: text, required: false, hint: "Si está vacío se usan las condiciones generales." }
      - { label: Notas internas, name: notas, widget: text, required: false }

  - name: configuracion
    label: Configuración de precios
    files:
      - name: constantes
        label: Constantes y costos base
        file: config/precios.json
        format: json
        fields:
          - { label: Luz (% sobre materiales), name: luz, widget: number, value_type: float, default: 0.2, hint: "0.2 = 20%" }
          - { label: Factor de precio, name: factor, widget: number, value_type: float, default: 2.3 }
          - { label: Anticipo, name: anticipo, widget: number, value_type: float, default: 0.5, hint: "0.5 = 50%" }
          - { label: Mano de obra mínima por cajón (CLP), name: cajon_mano_obra_minima, widget: number, value_type: int, required: false, default: 18000, hint: "Si la fórmula deja menos ganancia en un cajón, se cobra este mínimo (sin luz ni factor). Vacío = 15.000" }
          - label: Factor por tipo de mueble
            name: factores
            widget: object
            required: false
            hint: "Según lo difícil que es armar cada tipo (dueño, 2026-11-25). Vacío = el factor general de arriba. El anticipo sigue siendo el 50 %."
            fields:
              - { label: Basal, name: basal, widget: number, value_type: float, required: false, default: 2.6 }
              - { label: Aéreo, name: aereo, widget: number, value_type: float, required: false, default: 2.5 }
              - { label: Torre, name: torre, widget: number, value_type: float, required: false, default: 2.3 }
              - { label: Isla, name: isla, widget: number, value_type: float, required: false, default: 2.9 }
              - { label: Esquinero, name: esquinero, widget: number, value_type: float, required: false, default: 3.0 }
          - { label: Terceros de cubierta (instalación y despacho de la piedra), name: terceros_cubierta, widget: number, value_type: float, required: false, default: 0.1, hint: "0.1 = 10 % sobre el costo de las cubiertas que hace un tercero (no las de taller). Se cobra aparte, sin margen y no cuenta como tu mano de obra. Cada proyecto puede tener el suyo." }
          - { label: Condiciones generales, name: condiciones, widget: text, required: false, default: "Precio en CLP. Anticipo del 50% para iniciar la fabricación; saldo contra entrega e instalación." }
          - label: Precio por plancha de melamina
            name: planchas
            widget: list
            required: false
            fields:
              - { label: Melamina, name: codigo, widget: select, options: [{ label: "* Todas (precio por defecto)", value: "*" }, { label: "Boreal (Unicolor)", value: "boreal" }, { label: "Gris Ceniza (Unicolor)", value: "gris-ceniza" }, { label: "Manglar (Unicolor)", value: "manglar" }, { label: "Terracota Charyn (Unicolor)", value: "terracota-charyn" }, { label: "Uyuni (Unicolor)", value: "uyuni" }, { label: "Aluminio (Unicolor)", value: "aluminio" }, { label: "Azul Acero (Unicolor)", value: "azul-acero" }, { label: "Blanco (Unicolor)", value: "blanco-softwood" }, { label: "Gres (Unicolor)", value: "gres" }, { label: "Gris (Unicolor)", value: "gris" }, { label: "Gris Grafito (Unicolor)", value: "gris-grafito-natural-matt" }, { label: "Gris Grafito (Unicolor)", value: "gris-grafito-soft" }, { label: "Negro (Unicolor)", value: "negro-natural-matt" }, { label: "Negro (Unicolor)", value: "negro-soft" }, { label: "Pacífico (Unicolor)", value: "pacifico" }, { label: "Rojo Colonial (Unicolor)", value: "rojo-colonial" }, { label: "Verde Glaciar (Unicolor)", value: "verde-glaciar" }, { label: "Visón (Unicolor)", value: "vison-texstone" }, { label: "Visón (Unicolor)", value: "vison-basic" }, { label: "Grafito (Unicolor)", value: "grafito-ultra-mate" }, { label: "Negro (Unicolor)", value: "negro-ultra-mate" }, { label: "Visón (Unicolor)", value: "vison-ultra-mate" }, { label: "Blanco (Unicolor)", value: "blanco-alto-brillo" }, { label: "Grafito (Unicolor)", value: "grafito-alto-brillo" }, { label: "Negro (Unicolor)", value: "negro-alto-brillo" }, { label: "Ciprés Dorado (Maderas)", value: "cipres-dorado" }, { label: "Nogal Biloba (Maderas)", value: "nogal-biloba" }, { label: "Acacia Arena (Maderas)", value: "acacia-arena" }, { label: "Bosco (Maderas)", value: "bosco" }, { label: "Carvalo (Maderas)", value: "carvalo" }, { label: "Castaño Blanco (Maderas)", value: "castano-blanco" }, { label: "Cava (Maderas)", value: "cava" }, { label: "Cedro (Maderas)", value: "cedro" }, { label: "Cerezo (Maderas)", value: "cerezo" }, { label: "Coigüe (Maderas)", value: "coigue" }, { label: "Coigüe Chocolate (Maderas)", value: "coigue-chocolate" }, { label: "Colina (Maderas)", value: "colina" }, { label: "Enigma (Maderas)", value: "enigma" }, { label: "Fogón (Maderas)", value: "fogon" }, { label: "Fresno Humo (Maderas)", value: "fresno-humo" }, { label: "Laricina (Maderas)", value: "laricina" }, { label: "Nogal Africano (Maderas)", value: "nogal-africano" }, { label: "Nogal Amazónico (Maderas)", value: "nogal-amazonico" }, { label: "Nogal Ceniza (Maderas)", value: "nogal-ceniza" }, { label: "Olmo Alpino (Maderas)", value: "olmo-alpino" }, { label: "Peral (Maderas)", value: "peral" }, { label: "Roble Antracita (Maderas)", value: "roble-antracita" }, { label: "Roble Milano (Maderas)", value: "roble-milano" }, { label: "Roble Moro (Maderas)", value: "roble-moro" }, { label: "Roble Santana (Maderas)", value: "roble-santana" }, { label: "Sahara (Maderas)", value: "sahara" }, { label: "Santorini (Maderas)", value: "santorini" }, { label: "Savia (Maderas)", value: "savia" }, { label: "Teca Limo (Maderas)", value: "teca-limo" }, { label: "Valle (Maderas)", value: "valle" }, { label: "Cantera (Piedras y Textiles)", value: "cantera" }, { label: "Concreto Metropolitan (Piedras y Textiles)", value: "concreto-metropolitan" }, { label: "Cumbre (Piedras y Textiles)", value: "cumbre" }, { label: "Fibra (Piedras y Textiles)", value: "fibra" }, { label: "Lino (Piedras y Textiles)", value: "lino" }, { label: "Magma (Piedras y Textiles)", value: "magma" }, { label: "Sierra (Piedras y Textiles)", value: "sierra" }, { label: "Wengue (Maderas)", value: "wengue" }, { label: "Farola (Maderas)", value: "farola" }, { label: "Mortero (Piedras y Textiles)", value: "mortero" }, { label: "Blanca Premium (Unicolor)", value: "blanca-premium" }, { label: "Blanca Clásica (Unicolor)", value: "blanca-clasica" }] }
              - { label: Formato, name: formato, widget: select, required: false, options: ["1830x2500", "2140x2500"] }
              - { label: Espesor (mm), name: espesor, widget: select, required: false, options: ["5.5", "15", "18"] }
              - { label: Precio (CLP), name: precio, widget: number, value_type: int }
              - { label: Link Imperial (para actualizar precio y stock), name: url_imperial, widget: string, required: false }
              - { label: SKU del tapacanto en Imperial (para el Excel del optimizador), name: tapacanto_sku, widget: string, required: false, hint: "Ej: 130908" }
              - { label: Link Homecenter (para actualizar precio y stock), name: url_sodimac, widget: string, required: false }
          - label: Cholguán (traseras y fondos de cajón)
            name: cholguan
            widget: list
            required: false
            hint: "Código: blanco, o el código de una melamina para cholguán de color. * = precio por defecto."
            fields:
              - { label: Código, name: codigo, widget: string, default: blanco }
              - { label: Formato, name: formato, widget: select, required: false, options: ["1520x2440", "1830x2500"] }
              - { label: Precio por plancha (CLP), name: precio, widget: number, value_type: int }
              - { label: Link Imperial, name: url_imperial, widget: string, required: false }
              - { label: Link Homecenter, name: url_sodimac, widget: string, required: false }
          - label: Herrajes y tapacanto
            name: herrajes
            widget: object
            required: false
            fields:
              - { label: Bisagra de cierre suave (CLP c/u), name: bisagra, widget: number, value_type: int, required: false, hint: "Se usa si no pones precio a la recta o a la semicurva" }
              - { label: Bisagra recta 90° (CLP c/u), name: bisagra_recta, widget: number, value_type: int, required: false, hint: "Puertas que abren hacia un costado libre" }
              - { label: Bisagra semicurva (CLP c/u), name: bisagra_semicurva, widget: number, value_type: int, required: false, hint: "Puertas que abren hacia otra puerta (división compartida)" }
              - { label: Pino tapa canteada 1x4 de 3,2 m (CLP por tira), name: pino_tira, widget: number, value_type: int, required: false, default: 1600, hint: "Zócalo y soportes traseros" }
              - { label: Bisagra de 165° cierre suave (CLP c/u), name: bisagra_165, widget: number, value_type: int, required: false, default: 3500, hint: "Esquineros 2a y 2b: 2 por hoja de 30 cm, 3 si la hoja es más ancha" }
              - { label: Plato giratorio 15 cm (CLP c/u), name: plato_giratorio, widget: number, value_type: int, required: false, default: 7590, hint: "Esquinero puerta giratoria: 2 por módulo (abajo y arriba). Imperial, producto 2206" }
              - { label: Retenes magnéticos (CLP por caja de 10), name: retenes_caja, widget: number, value_type: int, required: false, default: 4290, hint: "Esquinero puerta giratoria: 2 por módulo; se cobra la caja completa (una caja sirve para varios módulos del proyecto)" }
              - { label: Barra de acero 3/4" de 6 m (CLP por barra), name: barra_eje, widget: number, value_type: int, required: false, default: 15781, hint: "Ejes de los cajones pivotantes: 2 por módulo; se cobra la barra entera (el resto sirve para otro módulo del proyecto)" }
              - { label: Tapacanto de color (CLP por metro), name: tapacanto_ml, widget: number, value_type: int, required: false, hint: "El de los frentes y piezas de color (ej. PVC 22×1 mm)" }
              - { label: Tapacanto blanco (CLP por metro), name: tapacanto_blanco_ml, widget: number, value_type: int, required: false, hint: "El de las piezas en melamina blanca (ej. PVC blanco 22×0,45 mm). Vacío = el de color." }
              - { label: Merma de tableros (%), name: merma, widget: number, value_type: float, default: 0.1, required: false, hint: "0.1 = 10% extra por cortes" }
              - label: Productos en las tiendas (actualizan los precios de herrajes)
                name: productos
                widget: list
                required: false
                summary: "{{fields.item}} {{fields.largo}}"
                hint: "Pega el link de la ficha en Imperial y/o Homecenter. Contenido = unidades del paquete (bisagras), pares (correderas) o metros del rollo (tapacanto)."
                fields:
                  - { label: Ítem, name: item, widget: select, options: [bisagra, bisagra_recta, bisagra_semicurva, corredera, tapacanto, tapacanto_blanco, pino] }
                  - { label: Largo (solo correderas, cm), name: largo, widget: select, required: false, options: ["25", "30", "35", "40", "45", "50", "55", "60"] }
                  - { label: Contenido del paquete, name: contenido, widget: number, value_type: float, default: 1 }
                  - { label: Link Imperial, name: url_imperial, widget: string, required: false }
                  - { label: Link Homecenter, name: url_sodimac, widget: string, required: false }
              - label: Correderas telescópicas de cierre suave (precio por par)
                name: correderas
                widget: list
                required: false
                fields:
                  - { label: Largo (cm), name: largo, widget: select, options: ["25", "30", "35", "40", "45", "50", "55", "60"] }
                  - { label: Precio por par (CLP), name: precio, widget: number, value_type: int }
          - label: Tiradores
            name: tiradores
            widget: list
            required: false
            fields:
              - { label: Nombre, name: nombre, widget: string }
              - { label: Forma, name: forma, widget: select, default: barra, options: [{ label: "Barra", value: barra }, { label: "Botón", value: boton }, { label: "Perfil / gola", value: perfil }, { label: "Sin tirador (push)", value: sin }] }
              - { label: Color, name: color, widget: color, default: "#161616" }
              - { label: Material (para el brillo), name: color_nombre, widget: string, required: false, hint: "Ej: acero, aluminio, latón. Si es metal se ve brillante." }
              - { label: Largo (cm), name: largo, widget: number, value_type: float, default: 16, required: false, hint: "Barra: distancia entre centros (ej. 12,8 para 128 mm). Botón o perilla: su diámetro." }
              - { label: Grosor (cm), name: grosor, widget: number, value_type: float, required: false, hint: "Diámetro del tubo de la barra (ej. 1,2 para 12 mm). Vacío = 1 cm." }
              - { label: SKU Imperial, name: sku, widget: string, required: false }
              - { label: Precio unitario (CLP), name: precio, widget: number, value_type: int }
          - label: Cubiertas (lo que elige el cliente)
            name: cubiertas
            widget: list
            required: false
            summary: "{{fields.nombre}} · {{fields.material}}"
            fields:
              - { label: Nombre, name: nombre, widget: string, hint: "No cambies el nombre de una cubierta que ya eligió un cliente: su selección guarda el nombre." }
              - { label: Color, name: color, widget: color, default: "#cfc9bc" }
              - { label: Material, name: material, widget: relation, collection: configuracion, file: constantes, search_fields: ["cubiertas_materiales.*.nombre"], display_fields: ["cubiertas_materiales.*.nombre"], value_field: "cubiertas_materiales.*.id", required: false, hint: "El precio sale del material (m², merma, sacados, respaldo, instalación y margen). Sin material se cobra por metro lineal." }
              - { label: Precio por metro lineal (CLP), name: precio_ml, widget: number, value_type: int, required: false, hint: "Solo si no eliges un material." }
          - label: Materiales de cubierta (precio y reglas físicas)
            name: cubiertas_materiales
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.nombre}} · {{fields.precio_m2}}/m²"
            hint: "Valores de referencia de Gemini (Región Metropolitana, nov. 2026, con IVA). Precio = (m² × merma × precio + m² × instalación + sacados + respaldo) × margen. Las cubiertas no llevan la luz ni el factor de los muebles: llevan su margen."
            fields:
              - { label: Identificador (no cambiar), name: id, widget: string, hint: "Minúsculas y guiones, ej: granito-natural-20mm. Las cubiertas lo usan para encontrar su material." }
              - { label: Nombre, name: nombre, widget: string }
              - { label: Categoría, name: categoria, widget: select, options: [postformado, laminado_hpl, madera_maciza, granito, cuarzo, marmol, piedra_sinterizada, superficie_solida, porcelanato, acero_inoxidable, concreto, otro] }
              - { label: Quién la fabrica, name: fabricacion, widget: select, default: subcontrato, options: [{ label: "Mi taller", value: taller }, { label: "Marmolero / proveedor", value: subcontrato }] }
              - { label: Espesor (mm), name: espesor_mm, widget: number, value_type: int, required: false }
              - { label: Precio del material por m² (CLP), name: precio_m2, widget: number, value_type: int, hint: "Solo el material, sin instalación." }
              - { label: Merma (ej. 1,18 = 18 %), name: merma, widget: number, value_type: float, default: 1.15 }
              - { label: Instalación por m² (CLP), name: instalacion_m2, widget: number, value_type: int, default: 0, required: false, hint: "Estimado incluido en el precio (el cliente no la ve aparte)." }
              - { label: Margen de venta, name: margen, widget: number, value_type: float, default: 1.25, hint: "Multiplica el costo total. Marmolero: 1,25 (+25 %). Taller: 1,8 a 2,0 (incluye tu mano de obra)." }
              - { label: Sacado lavaplatos sobrepuesto (CLP), name: sacado_sobrepuesto, widget: number, value_type: int, default: 0, required: false }
              - { label: Sacado lavaplatos bajo cubierta (CLP), name: sacado_bajo, widget: number, value_type: int, default: 0, required: false }
              - { label: Sacado encimera (CLP), name: sacado_encimera, widget: number, value_type: int, default: 0, required: false }
              - { label: Permite lavaplatos bajo cubierta, name: permite_bajo, widget: boolean, default: true, required: false, hint: "Desactivado: si el proyecto tiene un lavaplatos bajo cubierta, el cliente no puede elegir este material." }
              - { label: Trasera integrada (no cobra respaldo), name: trasera_integrada, widget: boolean, default: false, required: false }
              - { label: Respaldo por metro lineal (CLP), name: respaldo_ml, widget: number, value_type: int, default: 0, required: false, hint: "Zócalo contra el muro. Vacío o 0 = 15 % del precio por m² por metro." }
              - { label: Costo por unión (CLP), name: costo_union, widget: number, value_type: int, default: 0, required: false, hint: "Se cobra por cada unión que obliga el largo máximo y por la unión en 90° del rincón del esquinero." }
              - { label: Costo por unión en 45° (CLP), name: costo_union_45, widget: number, value_type: int, required: false, hint: "Unión ingletada del rincón del esquinero (corte diagonal). Además se cobra el triángulo de desperdicio. Vacío = el costo por unión." }
              - { label: Permite unión en 45°, name: permite_union_45, widget: boolean, default: true, required: false, hint: "Si no, el rincón del esquinero se cobra siempre en 90° aunque el cliente elija 45°." }
              - { label: Largo máximo sin unión (cm), name: largo_max_sin_union, widget: number, value_type: int, required: false }
              - { label: Vuelo máximo sin apoyo (cm), name: vuelo_max_sin_apoyo, widget: number, value_type: int, required: false, hint: "Sobre esto el editor avisa que necesita refuerzo." }
              - { label: Vuelo máximo con refuerzo (cm), name: vuelo_max_con_refuerzo, widget: number, value_type: int, required: false, hint: "Sobre esto el cliente no puede elegir el material." }
              - { label: Distancia máxima entre apoyos (cm), name: distancia_max_apoyos, widget: number, value_type: int, required: false }
              - { label: Requiere base continua, name: requiere_base_continua, widget: boolean, default: false, required: false }
              - { label: Se trata como postformado, name: similar_postformado, widget: boolean, default: false, required: false, hint: "Trasera y borde como el postformado: usa las reglas que ya tiene el cotizador." }
              - { label: Resistencia al calor, name: resiste_calor, widget: select, required: false, options: [baja, media, alta] }
              - { label: Resistencia a manchas, name: resiste_manchas, widget: select, required: false, options: [baja, media, alta] }
              - { label: Características (las ve el cliente), name: caracteristicas, widget: text, required: false, hint: "Frases cortas separadas por ·" }
              - { label: Reglas de instalación (internas), name: reglas_instalacion, widget: text, required: false }
              - { label: Formato de plancha (largo x ancho, mm), name: formato, widget: string, required: false }
              - { label: Confianza del dato, name: confianza, widget: select, required: false, options: [alta, media, baja] }
              - { label: Fuentes, name: fuentes, widget: text, required: false }
          - label: Cubiertas · tabla antigua por tipo (solo si no hay materiales)
            name: cubiertas_tabla
            widget: object
            required: false
            collapsed: true
            hint: "Vacío = valores por defecto (postformado 65.000 ×1,10; granito 160.000 ×1,18; cuarzo 245.000 ×1,18; mármol 400.000 ×1,20)."
            fields:
              - { label: Postformado CLP/m², name: postformado, widget: number, value_type: int, required: false }
              - { label: Granito CLP/m², name: granito, widget: number, value_type: int, required: false }
