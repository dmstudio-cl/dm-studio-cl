# Decap CMS · proyectos privados de clientes (repo PRIVADO).
# Este archivo es público pero no contiene secretos: solo describe el formulario.
backend:
  name: github
  repo: dmstudio-cl/proyectos-clientes          # [PENDIENTE] crear repo privado
  branch: main
  base_url: https://dmstudio-cms-auth.moralesdiego905.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: "Proyecto: crear «{{path}}»"
    update: "Proyecto: actualizar «{{path}}»"
    delete: "Proyecto: eliminar «{{path}}»"
    uploadMedia: "Proyecto: subir archivo «{{path}}»"
    deleteMedia: "Proyecto: eliminar archivo «{{path}}»"

locale: es
media_folder: media
public_folder: media

collections:
  - name: proyectos
    label: Proyectos de clientes
    label_singular: Proyecto
    folder: proyectos
    extension: json
    format: json
    create: true
    identifier_field: titulo   # el nombre del archivo sale del título (sin esto Decap usaba todo el contenido, incluida la clave)
    slug: "{{year}}-{{fields.titulo}}"   # explícito: con {{slug}} Decap usó todo el contenido como nombre
    summary: "{{cliente.nombre}} · {{titulo}} · {{estado}}"
    sortable_fields: [titulo, estado]
    fields:
      - { label: Título del proyecto, name: titulo, widget: string, hint: "Ej: Cocina departamento Ñuñoa. Después de guardar, ábrelo en el Editor de modelos (/admin/editor/) para dibujar el mueble." }
      - label: Clave de acceso
        name: access_key
        widget: clave
        pattern: ['^DM-[A-Z0-9]{4}-[A-Z0-9]{4}$', "Formato DM-XXXX-XXXX (mayúsculas y números)"]
        hint: "Se genera sola al crear el proyecto (botón Generar para otra). Para revocar el acceso, genera una nueva o marca el proyecto como Archivado."
      - label: Estado
        name: estado
        widget: select
        default: borrador
        options:
          - { label: "Borrador (cliente no puede entrar)", value: borrador }
          - { label: "Propuesta enviada", value: propuesta }
          - { label: "Cambios solicitados", value: cambios }
          - { label: "Aprobado", value: aprobado }
          - { label: "En fabricación", value: fabricacion }
          - { label: "Entregado", value: entregado }
          - { label: "Archivado (acceso revocado)", value: archivado }
      - { label: Versión de la propuesta, name: version, widget: number, value_type: int, default: 1 }
      - { label: Precio válido hasta, name: vigencia, widget: datetime, date_format: "DD-MM-YYYY", time_format: false, format: "YYYY-MM-DD", required: false }
      - label: Cliente
        name: cliente
        widget: object
        fields:
          - { label: Nombre, name: nombre, widget: string }
          - { label: Email, name: email, widget: string, required: false, hint: "Recibe automáticamente un correo cuando publicas una versión o le respondes." }
          - { label: "WhatsApp (ej. 56912345678)", name: telefono, widget: string, required: false, hint: "Con número, el editor te abre WhatsApp con el aviso ya escrito para enviarlo con un toque." }
          - { label: Comuna, name: comuna, widget: string, required: false }

      - label: Tipo de modelo
        name: tipo
        widget: select
        default: melamina
        options:
          - { label: "Mueble de melamina paramétrico", value: melamina }
          - { label: "Modelo 3D (.glb)", value: glb }
      - { label: Modelo 3D (.glb), name: modelo, widget: file, required: false, hint: "Solo si el tipo es 'Modelo 3D'." }

      - label: Módulos (se dibujan en el Editor de modelos)
        name: modulos
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.nombre}} · {{fields.ancho}}×{{fields.profundidad}}×{{fields.alto}} cm"
        hint: "Lo normal es dibujarlos en /admin/editor/ y publicarlos desde ahí. Aquí puedes revisarlos o corregir un número."
        fields:
          - { label: ID (lo asigna el editor), name: id, widget: string, required: false }
          - { label: Cocina de referencia (la usa el editor), name: plantilla, widget: string, required: false }
          - { label: Nombre, name: nombre, widget: string, hint: "Ej: Mueble A, Aéreo sobre encimera" }
          - { label: Tipo, name: tipo, widget: select, default: base, options: [base, aereo, torre, isla, esquinero] }
          - { label: Ancho, name: ancho, widget: number, value_type: float }
          - { label: Alto, name: alto, widget: number, value_type: float }
          - { label: Profundidad, name: profundidad, widget: number, value_type: float }
          - { label: Zócalo, name: zocalo, widget: number, value_type: float, default: 10 }
          - { label: Retiro del zócalo, name: zocalo_retiro, widget: number, value_type: float, default: 5, required: false }
          - { label: Retiro del zócalo atrás, name: zocalo_atras, widget: number, value_type: float, required: false }
          - { label: Retiro del zócalo izquierdo, name: zocalo_izq, widget: number, value_type: float, required: false }
          - { label: Retiro del zócalo derecho, name: zocalo_der, widget: number, value_type: float, required: false }
          - { label: Vuelo de la cubierta al frente, name: vuelo_frente, widget: number, value_type: float, required: false }
          - { label: Costados alargados hacia atrás, name: costados_atras, widget: number, value_type: float, required: false }
          - { label: Vuelo de la cubierta atrás, name: vuelo_atras, widget: number, value_type: float, required: false }
          - { label: Vuelo de la cubierta a la izquierda, name: vuelo_izq, widget: number, value_type: float, required: false }
          - { label: Vuelo de la cubierta a la derecha, name: vuelo_der, widget: number, value_type: float, required: false }
          - label: Luces LED (las ubica el editor)
            name: luces
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.en}} · {{fields.lado}} · {{fields.tono}}"
            fields:
              - { label: ID, name: id, widget: string, required: false }
              - { label: Dónde (modulo, cubierta o f|columna|fila), name: en, widget: string }
              - { label: Espacio entre repisas (desde abajo), name: esp, widget: number, value_type: int, required: false }
              - { label: Lado, name: lado, widget: select, options: [arriba, abajo, izq, der, atras] }
              - { label: Tono, name: tono, widget: select, options: [calida, neutra, fria] }
              - { label: Intensidad (0 a 1), name: intensidad, widget: number, value_type: float, required: false }
          - { label: Altura desde el piso, name: elevacion, widget: number, value_type: float, default: 0, hint: "Para muebles aéreos" }
          - { label: "Posición X (a lo largo del muro)", name: x, widget: number, value_type: float, default: 0 }
          - { label: "Posición Z (desde el muro)", name: z, widget: number, value_type: float, default: 0 }
          - { label: Giro en planta (grados), name: rotacion, widget: number, value_type: float, default: 0, hint: "Lo ajusta el editor. 90 = el frente mira hacia +X." }
          - { label: Lleva cubierta, name: cubierta, widget: boolean, default: false }
          - { label: Zócalo de cubierta (respaldo), name: cubierta_respaldo, widget: boolean, default: false, required: false }
          - { label: Tablero (mm), name: tablero, widget: select, default: "15", options: ["15", "18"], required: false }
          - { label: Techo de melamina, name: techo, widget: select, options: [si, "no"], required: false, hint: "Vacío = automático (basales sin techo; aéreos y torres con techo)" }
          - { label: Artefacto de piso (lo usa el editor), name: artefacto, widget: string, required: false }
          - { label: Costados visibles, name: costados, widget: select, options: [frente, cuerpo], required: false }
          - { label: Materiales por pieza (los asigna el editor), name: materiales, widget: string, required: false }
          - { label: Piezas quitadas del cuerpo, name: quitar, widget: select, multiple: true, options: [piso, techo, fondo, izq, der, soporte], required: false }
          - { label: Mueble agrupado (lo usa el editor), name: grupo, widget: string, required: false }
          - { label: Nombre del mueble agrupado, name: grupo_nombre, widget: string, required: false }
          - label: Encimeras y lavaplatos (los ubica el editor)
            name: artefactos
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.tipo}} {{fields.ancho}}×{{fields.fondo}}"
            fields:
              - { label: ID, name: id, widget: string, required: false }
              - { label: Modelo, name: tipo, widget: select, options: [encimera_gas, encimera_electrica, encimera_2, lavaplatos_1, lavaplatos_2] }
              - { label: Al costado izquierdo (cm), name: desde, widget: number, value_type: float }
              - { label: Al canto de la cubierta (cm), name: frente, widget: number, value_type: float }
              - { label: Ancho (cm), name: ancho, widget: number, value_type: float }
              - { label: Fondo (cm), name: fondo, widget: number, value_type: float }
              - { label: Escurridor, name: lado, widget: select, options: [derecha, izquierda], required: false }
          - label: Columnas (de izquierda a derecha)
            name: columnas
            widget: list
            required: false
            summary: "{{fields.ancho}} cm · {{fields.frentes}}"
            fields:
              - { label: Ancho, name: ancho, widget: number, value_type: float }
              - label: Frentes (de arriba a abajo)
                name: frentes
                widget: list
                summary: "{{fields.tipo}} {{fields.alto}} cm"
                fields:
                  - { label: Tipo, name: tipo, widget: select, options: [puerta, puerta_doble, cajon, panel, abierto, campana] }
                  - { label: Alto, name: alto, widget: number, value_type: float }
                  - { label: Bisagra, name: bisagra, widget: select, default: izquierda, options: [izquierda, derecha, arriba, abajo], required: false }
                  - { label: Frente del cajón, name: montaje, widget: select, options: [sobre, dentro], required: false, hint: "sobre = sobre los cantos (como una puerta); dentro = dentro de las separaciones" }
                  - { label: Repisas, name: repisas, widget: number, value_type: int, required: false }
                  - { label: Hojas (puertas de la sección), name: hojas, widget: number, value_type: int, required: false }
          - label: Tiradores (ubicados en el editor)
            name: tiradores
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.modelo}} · columna {{fields.col}} fila {{fields.fila}}"
            fields:
              - { label: ID, name: id, widget: string, required: false }
              - { label: Modelo, name: modelo, widget: string, hint: "Lo pone el editor (ej. barra-128, barra-160-12, boton-30)." }
              - { label: Color, name: color, widget: string, required: false }
              - { label: Columna (desde 0), name: col, widget: number, value_type: int, required: false, hint: "Vacío en el tirador del esquinero (lo ubica el editor)." }
              - { label: Fila (desde 0), name: fila, widget: number, value_type: int, required: false }
              - { label: Desde el centro → (cm), name: dx, widget: number, value_type: float, default: 0, required: false }
              - { label: Desde el centro ↑ (cm), name: dy, widget: number, value_type: float, default: 0, required: false }
              - { label: Giro (°), name: rot, widget: number, value_type: float, default: 0, required: false }

      - label: Opciones visibles para el cliente
        name: opciones
        widget: object
        required: false
        fields:
          - { label: Melaminas habilitadas, name: melaminas, widget: select, multiple: true, required: false, hint: "Vacío = todo el catálogo Masisa", options: [{ label: "Boreal (Unicolor)", value: "boreal" }, { label: "Gris Ceniza (Unicolor)", value: "gris-ceniza" }, { label: "Manglar (Unicolor)", value: "manglar" }, { label: "Terracota Charyn (Unicolor)", value: "terracota-charyn" }, { label: "Uyuni (Unicolor)", value: "uyuni" }, { label: "Aluminio (Unicolor)", value: "aluminio" }, { label: "Azul Acero (Unicolor)", value: "azul-acero" }, { label: "Blanco (Unicolor)", value: "blanco-softwood" }, { label: "Gres (Unicolor)", value: "gres" }, { label: "Gris (Unicolor)", value: "gris" }, { label: "Gris Grafito (Unicolor)", value: "gris-grafito-natural-matt" }, { label: "Gris Grafito (Unicolor)", value: "gris-grafito-soft" }, { label: "Negro (Unicolor)", value: "negro-natural-matt" }, { label: "Negro (Unicolor)", value: "negro-soft" }, { label: "Pacífico (Unicolor)", value: "pacifico" }, { label: "Rojo Colonial (Unicolor)", value: "rojo-colonial" }, { label: "Verde Glaciar (Unicolor)", value: "verde-glaciar" }, { label: "Visón (Unicolor)", value: "vison-texstone" }, { label: "Visón (Unicolor)", value: "vison-basic" }, { label: "Grafito (Unicolor)", value: "grafito-ultra-mate" }, { label: "Negro (Unicolor)", value: "negro-ultra-mate" }, { label: "Visón (Unicolor)", value: "vison-ultra-mate" }, { label: "Blanco (Unicolor)", value: "blanco-alto-brillo" }, { label: "Grafito (Unicolor)", value: "grafito-alto-brillo" }, { label: "Negro (Unicolor)", value: "negro-alto-brillo" }, { label: "Ciprés Dorado (Maderas)", value: "cipres-dorado" }, { label: "Nogal Biloba (Maderas)", value: "nogal-biloba" }, { label: "Acacia Arena (Maderas)", value: "acacia-arena" }, { label: "Bosco (Maderas)", value: "bosco" }, { label: "Carvalo (Maderas)", value: "carvalo" }, { label: "Castaño Blanco (Maderas)", value: "castano-blanco" }, { label: "Cava (Maderas)", value: "cava" }, { label: "Cedro (Ma