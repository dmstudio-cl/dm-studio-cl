# Decap CMS · sitio público dmstudio.cl
# OAuth: Cloudflare Worker propio. Reemplaza base_url por la URL real del Worker.
backend:
  name: github
  repo: dmstudio-cl/dm-studio-cl
  branch: main
  base_url: https://dmstudio-cms-auth.moralesdiego905.workers.dev
  auth_endpoint: auth
  commit_messages:
    create: "Contenido: crear {{collection}} «{{slug}}»"
    update: "Contenido: actualizar {{collection}} «{{slug}}»"
    delete: "Contenido: eliminar {{collection}} «{{slug}}»"
    uploadMedia: "Contenido: subir imagen «{{path}}»"
    deleteMedia: "Contenido: eliminar imagen «{{path}}»"

locale: es
site_url: https://dmstudio-cl.github.io/dm-studio-cl
display_url: https://dmstudio-cl.github.io/dm-studio-cl
logo_url: https://dmstudio-cl.github.io/dm-studio-cl/assets/img/marca/logo-192.webp

media_folder: assets/img/uploads
public_folder: /assets/img/uploads

collections:
  - name: portafolio
    label: Portafolio
    label_singular: Proyecto
    folder: _portafolio
    create: true
    slug: "{{slug}}"
    sortable_fields: [orden, title, categoria]
    summary: "{{title}} · {{categoria}}"
    fields:
      - { label: Título, name: title, widget: string }
      - label: Categoría
        name: categoria
        widget: select
        options: [Melamina, Mobiliario, Cocina, Iluminación, Decoración, Escritorio, Música, Objetos, Restauración, Diseño]
      - { label: Imagen principal, name: imagen, widget: image, hint: "JPG o WebP horizontal o vertical, idealmente bajo 500 KB." }
      - { label: Galería, name: galeria, widget: list, required: false, field: { label: Imagen, name: imagen, widget: image } }
      - { label: Modelo 3D (CSS), name: modelo_css, widget: file, required: false, hint: "Opcional. Archivo .json exportado desde el Editor de modelos (botón «Guardar .json»). Reemplaza la foto principal por un visor 3D." }
      - { label: Material, name: material, widget: string, required: false }
      - { label: Medidas, name: medidas, widget: string, required: false, hint: "Ej: 120 × 45 × 80 cm" }
      - { label: Año, name: anio, widget: number, required: false, value_type: int }
      - { label: Resumen, name: resumen, widget: text, required: false }
      - { label: Destacar en el inicio, name: destacado, widget: boolean, default: false }
      - { label: Orden, name: orden, widget: number, value_type: int, default: 99, hint: "Menor número = aparece antes" }
      - { label: Descripción, name: body, widget: markdown, required: false }

  - name: productos
    label: Catálogo
    label_singular: Producto
    folder: _productos
    create: true
    slug: "{{slug}}"
    sortable_fields: [orden, title, precio]
    summary: "{{title}} · ${{precio}}"
    fields:
      - { label: Nombre, name: title, widget: string }
      - { label: Categoría, name: categoria, widget: string, default: Mobiliario }
      - { label: Precio (CLP, sin puntos), name: precio, widget: number, value_type: int, required: false, hint: "Vacío = 'Precio a consultar'" }
      - { label: En stock, name: disponible, widget: boolean, default: true, hint: "Desactivado = se fabrica por encargo" }
      - { label: Fotos, name: imagenes, widget: list, required: false, field: { label: Foto, name: foto, widget: image } }
      - { label: Modelo 3D (CSS), name: modelo_css, widget: file, required: false, hint: "Archivo .json exportado desde el Editor de modelos (botón «Guardar .json»)." }
      - { label: Material, name: material, widget: string, required: false }
      - { label: Dimensiones, name: dimensiones, widget: string, required: false }
      - { label: Plazo de fabricación (días hábiles), name: plazo, widget: number, value_type: int, required: false }
      - { label: Plazo si se personaliza (días hábiles), name: plazo_personalizado, widget: number, value_type: int, required: false }
      - label: Opciones personalizables
        name: opciones
        widget: list
        required: false
        hint: "El primer valor de cada opción es el estándar (sin recargo ni plazo extra)."
        fields:
          - { label: Nombre de la opción, name: nombre, widget: string, hint: "Ej: Madera, Terminación, Medida" }
          - label: Valores
            name: valores
            widget: list
            fields:
              - { label: Valor, name: nombre, widget: string }
              - { label: Recargo (CLP), name: recargo, widget: number, value_type: int, default: 0 }
      - { label: Link de pago Mercado Pago, name: link_mercadopago, widget: string, required: false, hint: "Solo se muestra en productos sin opciones." }
      - { label: Resumen, name: resumen, widget: text, required: false }
      - { label: Producto de ejemplo, name: ejemplo, widget: boolean, default: false, required: false }
      - { label: Orden, name: orden, widget: number, value_type: int, default: 99 }
      - { label: Descripción, name: body, widget: markdown, required: false }

  - name: ajustes
    label: Ajustes del sitio
    files:
      - name: sitio
        label: Contacto y servicios
        file: _data/sitio.yml
        fields:
          - { label: WhatsApp (ej. 56912345678), name: whatsapp, widget: string, required: false }
          - { label: Email de contacto, name: email, widget: string, required: false }
          - { label: Instagram, name: instagram, widget: string, required: false }
          - { label: Ciudad, name: ciudad, widget: string, required: false }
          - { label: Web3Forms access key, name: web3forms_key, widget: string, required: false }
          - { label: Link de cobro MACH, name: mach_link, widget: string, required: false }
          - { label: URL del Cloudflare Worker, name: worker_url, widget: string, required: false }
          - { label: URL de dmstudio.dev, name: dev_url, widget: string, required: false }
      - name: despacho
        label: Despacho por comuna
        file: _data/despacho.yml
        fields:
          - { label: Tarifa base (CLP), name: tarifa_base, widget: number, value_type: int, default: 6000 }
          - { label: Valor por km (CLP), name: valor_km, widget: number, value_type: int, default: 450, hint: "Se multiplica por 2 (ida y vuelta). Despacho = tarifa base + km × 2 × valor por km + tag." }
          - label: Comunas
            name: comunas
            widget: list
            summary: "{{fields.nombre}} · {{fields.km}} km · tag ${{fields.tag}}"
            fields:
              - { label: Comuna, name: nombre, widget: string }
              - { label: Distancia (km, solo ida), name: km, widget: number, value_type: float }
              - { label: TAG / peajes (CLP), name: tag, widget: number, value_type: int, default: 0 }
      - name: reglas_cocina
        label: Reglas de diseño de cocina
        file: _data/reglas_cocina.yml
        fields:
          - { label: Personas que cocinan (por defecto), name: personas_cocina, widget: select, options: ["1", "2"], default: "1", hint: "Cambia el pasillo mínimo. Cada proyecto lo puede cambiar en el panel «Revisión de la cocina»." }
          - label: Zonas (cómo se reconoce cada una)
            name: zonas
            widget: object
            collapsed: true
            fields:
              - { label: Frío, name: frio, widget: object, fields: [{ label: Nombre, name: nombre, widget: string }, { label: Electrodomésticos, name: objetos, widget: select, multiple: true, options: [refri1, refri2, conservadora], required: false }] }
              - { label: Lavado, name: lavado, widget: object, fields: [{ label: Nombre, name: nombre, widget: string }, { label: Artefactos, name: artefactos, widget: select, multiple: true, options: [lavaplatos_1, lavaplatos_2], required: false }, { label: Electrodomésticos, name: objetos, widget: select, multiple: true, options: [lavavajillas], required: false }] }
              - { label: Cocción, name: coccion, widget: object, fields: [{ label: Nombre, name: nombre, widget: string }, { label: Artefactos, name: artefactos, widget: select, multiple: true, options: [encimera_gas, encimera_electrica, encimera_2], required: false }, { label: Cocinas de piso, name: cocinas_piso, widget: select, multiple: true, options: [cocina4, cocina6], required: false }, { label: Electrodomésticos, name: objetos, widget: select, multiple: true, options: [horno], required: false }] }
          - label: Reglas
            name: reglas
            widget: list
            summary: "{{fields.nombre}} · {{fields.tipo}}"
            hint: "verde = desde aquí está bien; rojo = bajo esto es un problema (entre ambos, amarillo). verde_2 y rojo_2 se usan en algunos tipos (el otro lado, la suma del triángulo). Medidas en cm."
            fields:
              - { label: Identificador, name: id, widget: string }
              - { label: Nombre, name: nombre, widget: string }
              - { label: Tipo, name: tipo, widget: select, options: [secuencia, libre_entre, libre_lados, apoyo, separacion, cerca_de, triangulo, pasillo, vano, campana, altura] }
              - { label: Zonas, name: zonas, widget: select, multiple: true, options: [frio, lavado, coccion], required: false }
              - { label: Electrodoméstico (cerca_de, altura), name: objeto, widget: select, options: [lavavajillas, microondas, horno, refri1, refri2, conservadora], required: false }
              - { label: Verde (cm), name: verde, widget: number, value_type: float, required: false }
              - { label: Verde 2 (cm), name: verde_2, widget: number, value_type: float, required: false }
              - { label: Rojo (cm), name: rojo, widget: number, value_type: float, required: false }
              - { label: Rojo 2 (cm), name: rojo_2, widget: number, value_type: float, required: false }
              - { label: Límite (cm), name: limite, widget: number, value_type: float, required: false, hint: "Triángulo: sobre esta suma es rojo." }
              - { label: Ayuda (la ves en el panel), name: ayuda, widget: text, required: false }
              - { label: Activa, name: activa, widget: boolean, default: true }
      - name: acabados
        label: Acabados de muros y suelo
        file: _data/acabados.yml
        fields:
          - label: Acabados
            name: acabados
            widget: list
            summary: "{{fields.grupo}} · {{fields.nombre}}"
            fields:
              - { label: Identificador (sin espacios), name: id, widget: string }
              - { label: Nombre, name: nombre, widget: string }
              - { label: Grupo, name: grupo, widget: select, options: [Azulejos, Palmetas, Baldosas, Otros], default: Azulejos }
              - { label: Para, name: para, widget: select, options: [{ label: Muros, value: muro }, { label: Suelo, value: suelo }, { label: Muros y suelo, value: ambos }], default: ambos }
              - { label: Patrón, name: patron, widget: select, options: [{ label: Liso, value: liso }, { label: Recto (cuadrícula), value: recto }, { label: Trabado (metro o ladrillo), value: trabado }, { label: Espiga (parquet), value: espiga }, { label: Hexagonal, value: hexagonal }, { label: Tablas (palmeta), value: tablas }, { label: Damero (2 colores), value: damero }], default: recto }
              - { label: Largo (cm), name: largo, widget: number, value_type: float, hint: "En hexagonal: de cara a cara." }
              - { label: Ancho (cm), name: ancho, widget: number, value_type: float, required: false }
              - { label: Junta (mm), name: junta, widget: number, value_type: float, default: 2 }
              - { label: Color, name: color, widget: color }
              - { label: Segundo color (damero), name: color2, widget: color, required: false }
              - { label: Color de la junta, name: color_junta, widget: color }
              - { label: Variación de tono (%), name: variacion, widget: number, value_type: int, default: 0, required: false }
              - { label: Girar 90°, name: giro, widget: select, options: [{ label: "No", value: 0 }, { label: "Sí", value: 90 }], default: 0, required: false }
          - label: Pinturas de muros
            name: pinturas
            widget: list
            summary: "{{fields.nombre}} · {{fields.color}}"
            fields:
              - { label: Identificador (sin espacios), name: id, widget: string }
              - { label: Nombre, name: nombre, widget: string }
              - { label: Color, name: color, widget: color }
