  - { id: palmeta-roble, nombre: "Palmeta roble 120 × 20", grupo: Palmetas, para: suelo, patron: tablas, largo: 120, ancho: 20, junta: 0.5, color: "#a97d4d", color_junta: "#6b4c2f", variacion: 14 }
