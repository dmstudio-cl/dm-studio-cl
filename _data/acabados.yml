# Biblioteca de acabados de muros y suelo (azulejos, palmetas, baldosas), editable en /admin → Acabados de muros y suelo.
# Se dibujan a escala real y con el color que se quiera; en el editor son esferas en la pestaña Materiales (como las melaminas).
# patron: liso | recto | trabado | espiga | hexagonal | tablas | damero. Medidas en cm; junta en mm; variacion en % (tono).
acabados:
  - { id: metro-blanco, nombre: "Metro blanco 7,5 × 15", grupo: Azulejos, para: muro, patron: trabado, largo: 15, ancho: 7.5, junta: 2, color: "#f2f0eb", color_junta: "#d6d2ca", variacion: 4 }
  - { id: metro-vertical, nombre: "Metro vertical 6,5 × 20", grupo: Azulejos, para: muro, patron: recto, largo: 20, ancho: 6.5, junta: 2, color: "#e9ece6", color_junta: "#cdd0ca", variacion: 5, giro: 90 }
